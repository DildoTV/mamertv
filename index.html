<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Матвей Бодяг</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --bg-main: #0d1117;
            --bg-panel: rgba(22, 27, 34, 0.9);
            --accent-cyan: #00d4ff;
            --accent-purple: #7b2ff7;
            --text-light: #e6edf3;
            --text-muted: #8b949e;
            --border-glass: rgba(255, 255, 255, 0.1);
            --glass-blur: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ====== ЗАГОЛОВОК ====== */
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            border-bottom: 1px solid var(--border-glass);
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ====== ОСНОВНАЯ СЕТКА ====== */
        .main-content {
            display: flex;
            gap: 30px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
            flex: 1;
        }

        /* ====== БОКОВАЯ ПАНЕЛЬ ====== */
        .sidebar {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Кнопка DONATION ALERTS */
        .btn {
            display: block;
            width: 100%;
            padding: 16px 20px;
            background: var(--bg-panel);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: var(--text-light);
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(var(--glass-blur));
        }

        .btn:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 212, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Панелька под кнопкой */
        .panel-box {
            background: var(--bg-panel);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(var(--glass-blur));
            margin-top: 20px;
        }

        .panel-title {
            color: var(--accent-cyan);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 10px;
        }

        .panel-text {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 10px;
        }

        .status-online {
            color: #3fb950;
            font-weight: 600;
        }

        /* ====== ВИДЕО ====== */
        .video-wrapper {
            flex: 1;
            min-width: 300px;
            max-width: 900px;
            background: var(--bg-panel);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(var(--glass-blur));
            padding: 10px;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 12px;
            display: block;
        }

        /* ====== ОПИСАНИЕ ====== */
        .description {
            margin-top: 40px;
            padding: 25px;
            background: var(--bg-panel);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            backdrop-filter: blur(var(--glass-blur));
        }

        .description p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 2;
            margin-bottom: 10px;
        }

        .description h3 {
            color: var(--text-light);
            font-size: 18px;
            margin-bottom: 15px;
        }

        /* ====== АДАПТИВНОСТЬ ====== */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .main-content { flex-direction: column; align-items: center; }
            .sidebar { width: 100%; max-width: 500px; order: 2; }
            .video-wrapper { order: 1; width: 100%; }
            .video-wrapper iframe { height: 300px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Заголовок -->
        <header>
            <h1>MamerTV</h1>
        </header>

        <!-- Основной контент -->
        <div class="main-content">
            
            <!-- Левая панель с одной кнопкой -->
            <div class="sidebar">
                <a href="https://www.donationalerts.com/r/flanixtech" class="btn">DONATION ALERTS</a>

                <!-- Панелька под кнопкой -->
                <div class="panel-box">
                    <div class="panel-title">* Welcome *</div>
                    <p class="panel-text">Перехватавайте MamerTV!</p>
                    <p class="panel-text">Жми на кнопку, чтобы поддержать.</p>
                    <p class="status-online"></p>
                </div>
            </div>

            <!-- Видео (Rutube) -->
<iframe width="720" height="405" src="https://rutube.ru/play/embed/65ff6335a34c54d8b05b274f22eb7b67/" style="border: none;" allow="clipboard-write; autoplay" allowFullScreen></iframe>

        <!-- Описание (заполните своим текстом) -->
        <div class="description">
            <h3>ОПИСАНИЕ</h3>
            <p>JGBCFYBT</p>
            <p>Подпишитесь на мой тт flanixtech</p>
        </div>
    </div>

</body>
</html>
